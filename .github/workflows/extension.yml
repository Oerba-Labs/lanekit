# LaneKit's editor extension, released: a tag vscode-v<version> (the version in vscode/package.json) runs the tests,
# packs the .vsix with vscode/pack.mjs (the same bytes every time, no dependency), attaches it to a GitHub release,
# both as lanekit-<version>.vsix and as lanekit.vsix (so .../releases/latest/download/lanekit.vsix is always the
# newest), and publishes it to Open VSX, where code-server, Cursor, VSCodium and Windsurf find it.
#
#     edit "version" in vscode/package.json, commit, then:
#     git tag vscode-v0.26.0 && git push origin vscode-v0.26.0
#
# NOT THE VS CODE MARKETPLACE. VS Code installs it once from the release's file; from then on the extension keeps
# itself up to date from the copy of lanekit on the machine, which follows the branch stable (test.yml): it builds a
# newer version of itself that the copy holds and installs it (vscode/extension.js). So a release is for a first
# install and for Open VSX, and is needed only when the loader or its manifest changes.
#
# Open VSX is published to only where OVSX_PAT, an open-vsx.org access token, is set as a secret of the repository;
# its namespace is "publisher" in vscode/package.json, made by the first publish. ovsx is fetched here, for this,
# and is never a dependency of lanekit.
name: Extension

on:
  push:
    tags: ['vscode-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag names the manifest's version
        id: version
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publisher=$(node -p "require('./vscode/package.json').publisher")" >> "$GITHUB_OUTPUT"
          echo "id=$(node -p "const m = require('./vscode/package.json'); m.publisher + '.' + m.name")" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "vscode-v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, and vscode/package.json says $version: tag vscode-v$version, or change the version"
            exit 1
          fi
      - name: A git identity for the scratch repositories
        run: |
          git config --global user.name "lanekit's tests"
          git config --global user.email tests@lanekit.invalid
          git config --global init.defaultBranch main
      - run: node --test
      - name: Pack
        id: pack
        run: |
          node vscode/pack.mjs --out "dist/lanekit-${{ steps.version.outputs.version }}.vsix"
          cp "dist/lanekit-${{ steps.version.outputs.version }}.vsix" dist/lanekit.vsix
      # The file, on a GitHub release of its own, first: there whatever Open VSX then says. Run again, it replaces it.
      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            In VS Code: `curl -fsSLo /tmp/lanekit.vsix https://github.com/Oerba-Labs/lanekit/releases/latest/download/lanekit.vsix && code --install-extension /tmp/lanekit.vsix`

            In code-server, Cursor, VSCodium or Windsurf: LaneKit (${{ steps.version.outputs.id }}) in the Extensions view, from Open VSX.

            Where there is no lanekit on the machine, it offers to install one in ~/.lanekit, and keeps that and itself up to date from the branch stable.
        run: |
          files=("dist/lanekit-${{ steps.version.outputs.version }}.vsix" dist/lanekit.vsix)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --latest --title "LaneKit for VS Code ${{ steps.version.outputs.version }}" --notes "$NOTES"
          fi
      # A version Open VSX has already is passed over, so a run can be run again.
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::warning::No OVSX_PAT secret, so not published to Open VSX"; exit 0; fi
          # Its namespace, made the first time; there already, this says so and goes on.
          npx --yes ovsx@0 create-namespace "${{ steps.version.outputs.publisher }}" -p "$OVSX_PAT" || true
          npx --yes ovsx@0 publish "dist/lanekit-${{ steps.version.outputs.version }}.vsix" -p "$OVSX_PAT" --skip-duplicate
