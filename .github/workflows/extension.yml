# LaneKit's editor extension, published: a tag vscode-v<version> (the version in vscode/package.json) runs the tests,
# packs the .vsix with vscode/pack.mjs (the same bytes every time, no dependency), publishes that one file to Open
# VSX (code-server, Cursor, VSCodium, Windsurf) and to the VS Code Marketplace, and attaches it to a GitHub release.
#
# Each store is published to only where its token is set as a secret of the repository: OVSX_PAT (open-vsx.org, a
# token of a member of the lanekit namespace) and VSCE_PAT (an Azure DevOps token, Marketplace: Manage, of the
# publisher lanekit). Without one, that store is said to be left out and the rest goes on. The publishing tools are
# fetched here, for this, and are never a dependency of lanekit.
#
#     edit "version" in vscode/package.json, commit, then:
#     git tag vscode-v0.25.0 && git push origin vscode-v0.25.0
#
# The extension is only its loader: what it runs comes from the copy of lanekit on each machine, which it keeps up
# to date from the branch stable (test.yml). So a release is needed only when the loader or its manifest changes.
name: Extension

on:
  push:
    tags: ['vscode-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag names the manifest's version
        id: version
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "vscode-v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, and vscode/package.json says $version: tag vscode-v$version, or change the version"
            exit 1
          fi
      - name: A git identity for the scratch repositories
        run: |
          git config --global user.name "lanekit's tests"
          git config --global user.email tests@lanekit.invalid
          git config --global init.defaultBranch main
      - run: node --test
      - name: Pack
        run: node vscode/pack.mjs --out "dist/lanekit-${{ steps.version.outputs.version }}.vsix"
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::warning::No OVSX_PAT secret, so not published to Open VSX"; exit 0; fi
          # Its namespace, made the first time; there already, this says so and goes on.
          npx --yes ovsx@0 create-namespace lanekit -p "$OVSX_PAT" || true
          npx --yes ovsx@0 publish "dist/lanekit-${{ steps.version.outputs.version }}.vsix" -p "$OVSX_PAT"
      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::warning::No VSCE_PAT secret, so not published to the VS Code Marketplace"; exit 0; fi
          npx --yes @vscode/vsce@3 publish --packagePath "dist/lanekit-${{ steps.version.outputs.version }}.vsix" -p "$VSCE_PAT"
      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/lanekit-${{ steps.version.outputs.version }}.vsix" \
            --title "LaneKit for VS Code ${{ steps.version.outputs.version }}" \
            --notes "Install from the Extensions view (LaneKit, lanekit.lanekit), or this file: code --install-extension lanekit-${{ steps.version.outputs.version }}.vsix. Where there is no lanekit on the machine, it offers to install one in ~/.lanekit, and keeps it up to date from the branch stable."
